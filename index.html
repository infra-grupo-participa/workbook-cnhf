<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./logo-cnhf.png" />
    <meta name="theme-color" content="#ff6b00" />
    <title>Workbook · Curso Nacional de Formação em Holding Familiar</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Service worker só em produção (https fora de localhost): em dev o
      // Vite serve módulos sem hash e o cache atrapalharia o HMR.
      if (
        'serviceWorker' in navigator &&
        location.protocol === 'https:' &&
        !['localhost', '127.0.0.1'].includes(location.hostname)
      ) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
